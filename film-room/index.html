<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film Room</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Film room at night: chalkboard diagram, flag-yellow marks only what needs action */
:root{--bg:#14191a;--panel:#1d2425;--line:#35403f;--fg:#e8ecea;--dim:#9aa8a5;--flag:#f2c230;--chalk:#17352a;--bad:#ff7a66;
--disp:"Saira Condensed","Arial Narrow",sans-serif;--body:Barlow,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 var(--body)}
button,input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:5px 8px}
button{cursor:pointer;background:var(--panel)}button:hover{border-color:var(--dim)}button.on{background:var(--flag);border-color:var(--flag);color:#191500;font-weight:600}
:focus-visible{outline:2px solid var(--flag);outline-offset:1px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
h1{font:700 22px var(--disp);letter-spacing:.04em;text-transform:uppercase;margin:0 8px 0 0}
h2{font:700 18px var(--disp);letter-spacing:.03em;text-transform:uppercase;margin:18px 0 6px}
#status{margin-left:auto;color:var(--dim)}#status.err{color:var(--bad);font-weight:600}
main{padding:12px 14px}
#chart{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media(max-width:1000px){#chart{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
#yt-wrap{aspect-ratio:16/9;background:#000;display:grid;place-items:center;color:var(--dim);text-align:center;padding:0}
#yt-wrap iframe,#yt-wrap video{width:100%;height:100%;border:0;background:#000}
#time{font:700 20px var(--disp);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
#strip{max-height:30vh;overflow:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--bg)}
#strip tr{cursor:pointer}#strip tr:hover{background:var(--panel)}#strip tr.sel{background:var(--panel);box-shadow:inset 3px 0 var(--flag)}
#field{width:100%;display:block;background:var(--chalk);touch-action:none;cursor:crosshair;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.grid label{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:12px;min-width:0}.grid input,.grid select{width:100%;color:var(--fg);font-size:14px}
.wide{grid-column:1/-1}textarea{width:100%;min-height:54px}
.hint{color:var(--dim);font-size:12.5px}
.banner{background:#3b2a12;border:1px solid var(--flag);padding:8px 12px;margin-bottom:10px;border-radius:3px}
.fileBtn{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 8px}.seg button{border-radius:0}.seg{display:inline-flex}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);padding:8px;cursor:pointer;border-radius:3px}.card b{font:700 17px var(--disp);text-transform:uppercase;letter-spacing:.02em}
.card svg{width:100%;display:block;background:var(--chalk);margin:6px 0}.card p{margin:2px 0;color:var(--dim)}
.tscroll{overflow-x:auto;margin-bottom:6px}
.empty{color:var(--dim);padding:30px;text-align:center}
</style></head><body>
<header>
  <h1>Film Room</h1>
  <select id="report" aria-label="Opponent"></select><button id="newReport">New opponent</button><button id="export">Export</button><label class="fileBtn">Import<input type="file" id="importFile" accept=".json,application/json" hidden></label>
  <span class="seg" id="tabs"><button data-t="chart" class="on">Chart film</button><button data-t="tend">Tendencies</button><button data-t="book">Playbook</button></span>
  <span id="status"></span>
</header>
<main>
<div id="banner" class="banner" hidden></div>
<div id="chart">
  <section>
    <div class="row"><select id="film" aria-label="Game film" style="flex:1;min-width:140px"></select><input id="filmUrl" placeholder="Paste YouTube link" style="flex:2;min-width:160px"><button id="addFilm">Add film</button><label class="fileBtn">Upload video<input type="file" id="vidFile" accept="video/*" hidden></label></div>
    <div id="yt-wrap"><div id="yt">Paste a YouTube link or upload a video to load the film.</div><video id="vid" controls playsinline preload="metadata" hidden></video></div>
    <div class="row" style="margin-top:8px">
      <button data-seek="-5">-5s</button><button data-seek="-1">-1s</button><button id="pp">Play/Pause</button><button data-seek="1">+1s</button><button data-seek="5">+5s</button>
      <span id="time">0:00</span>
      <select id="rate" aria-label="Speed"><option value="1">1x</option><option value=".5">0.5x</option><option value=".25">0.25x</option></select>
      <button id="mark" class="on">Mark play (M)</button><a id="ytLink" target="_blank" rel="noopener" style="color:var(--dim)">Open on YouTube</a>
    </div>
    <div id="strip"><table><thead><tr><th>#</th><th>Time</th><th>Side</th><th>D&amp;D</th><th>Formation</th><th>Call</th><th>Yds</th><th>PB</th></tr></thead><tbody id="plays"></tbody></table></div>
  </section>
  <section id="editor">
    <div class="row">
      <span class="seg" id="tools"></span>
      <input id="label" placeholder="Label" maxlength="3" style="width:58px" aria-label="Player label">
    </div>
    <div class="row">
      <select id="presetO" aria-label="Offense shell"><option value="">Offense shell</option></select>
      <select id="presetD" aria-label="Defense shell"><option value="">Defense shell</option></select>
      <button id="flip">Flip</button><button id="undo">Undo</button><button id="copyPrev">Copy previous</button><button id="clearD">Clear</button>
      <label class="fileBtn">Add screenshot<input type="file" id="shotFile" accept="image/*" hidden></label><label class="hint"><input type="checkbox" id="showShot" checked> Show it</label>
    </div>
    <svg id="field" viewBox="0 0 1000 600" role="img" aria-label="Formation diagram"></svg>
    <p class="hint">Pause on the pre-snap look, take a screenshot, then tap Add screenshot to pick it from Photos (on a PC, Win+Shift+S then Ctrl+V). Shells give you 11 to drag into place.</p>
    <div id="form" class="grid"></div>
    <div class="row" style="margin-top:8px"><button id="delPlay">Delete play</button></div>
  </section>
</div>
<div id="tend" hidden></div>
<div id="book" hidden></div>
</main>
<datalist id="dl-formation"></datalist><datalist id="dl-concept"></datalist><datalist id="dl-front"></datalist><datalist id="dl-coverage"></datalist>
<script src="tendencies.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmtT = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const parseT = v => { const p = String(v).split(':').map(Number); return p.some(isNaN) ? 0 : p.reduce((a, b) => a * 60 + b, 0); };
const ytId = u => (String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/) || [])[1];

/* ---------- storage: IndexedDB on this device, Export is the backup ---------- */
let index = [], R = null, sel = null, dirty = false, saving = false;
const shotUrls = {};
const dbp = new Promise((ok, no) => { const q = indexedDB.open('film-room', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); });
const idb = async (mode, fn) => { const d = await dbp; return new Promise((ok, no) => { const t = d.transaction('kv', mode), q = fn(t.objectStore('kv')); t.oncomplete = () => ok(q.result); t.onerror = t.onabort = () => no(t.error); }); };
const put = (k, v) => idb('readwrite', s => s.put(v, k));
const get = k => idb('readonly', s => s.get(k));
navigator.storage?.persist?.();
function status(t, err) { $('status').textContent = t; $('status').className = err ? 'err' : ''; }
function touch() { dirty = true; status('Saving...'); clearTimeout(touch.t); touch.t = setTimeout(flush, 500); }
async function flush() {
  if (saving || !dirty || !R) return;
  saving = true; dirty = false;
  try { await put('report:' + R.id, structuredClone(R)); status('Saved on this device'); }
  catch (e) { dirty = true; status('NOT SAVED. Export now and check that Private Browsing is off.', true); setTimeout(flush, 3000); }
  saving = false;
  if (dirty) touch();
}
addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

async function newReport() {
  const opponent = prompt('Opponent name'); if (!opponent) return;
  R = { id: uid(), opponent, films: [], plays: [] }; banner('');
  index.push({ id: R.id, opponent });
  await put('index', index);
  touch(); renderReports(); openReport();
}
async function loadShots() { for (const p of R.plays) if (p.shot && !shotUrls[p.shot]) { const b = await get('img:' + p.shot); if (b) shotUrls[p.shot] = URL.createObjectURL(b); } }
async function loadReport(id) { R = await get('report:' + id); await loadShots(); openReport(); }
function openReport() { sel = R.plays.at(-1)?.id || null; renderFilms(); if (R.films.length) loadFilm(R.films.at(-1).id); renderAll(); }
function renderReports() {
  $('report').innerHTML = index.map(r => `<option value="${esc(r.id)}">${esc(r.opponent)}</option>`).join('') || '<option value="">No opponents yet</option>';
  if (R) $('report').value = R.id;
}

/* ---------- YouTube ---------- */
let yt = null, ytReady = false, film = null, pendingSeek = null;
function onYouTubeIframeAPIReady() { ytReady = true; if (film && !film.local) cue(); }
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
{ const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => banner('Could not reach YouTube. Check your internet connection and reload.'); document.head.append(s); }
function banner(t) { $('banner').textContent = t; $('banner').hidden = !t; }
function renderFilms() {
  $('film').innerHTML = R?.films.map(f => `<option value="${esc(f.id)}">${esc(f.label)}${f.local ? ' (video file)' : ''}</option>`).join('') || '<option value="">No film yet</option>';
}
function addFilm() {
  const url = $('filmUrl').value.trim(), id = ytId(url);
  if (!R) return alert('Create an opponent first.');
  if (!id) return alert('That does not look like a YouTube video link.');
  const label = prompt('Name this game (ex: vs Knights, Oct 12)', `Game ${R.films.length + 1}`) || `Game ${R.films.length + 1}`;
  const f = { id: uid(), label, url, yt: id }; R.films.push(f);
  $('filmUrl').value = ''; touch(); renderFilms(); loadFilm(f.id);
}
function loadFilm(id) {
  film = R.films.find(f => f.id === id) || null; if (!film) return;
  $('film').value = id; banner('');
  const local = !!film.local;
  vid.hidden = !local; $('yt').hidden = local; $('ytLink').hidden = local;
  if (local) { try { yt?.pauseVideo?.(); } catch {} loadLocal(); return; }
  vid.pause(); vid.removeAttribute('src'); vid.load();
  $('ytLink').href = `https://www.youtube.com/watch?v=${film.yt}`;
  if (ytReady) cue();
}

/* ---------- uploaded video: saved in IndexedDB on this device, not in Export (too big) ---------- */
const vid = $('vid'), vidMem = {}; let vidUrl = null;
async function loadLocal() {
  const f = film, start = pendingSeek ?? 0; pendingSeek = null;
  const b = vidMem[f.id] || await get('vid:' + f.id).catch(() => null);
  if (film !== f) return;
  f.missing = !b;
  if (!b) { vid.removeAttribute('src'); return banner(`The video "${f.name || f.label}" is not on this device. Tap Upload video and pick it again to reattach it to your plays.`); }
  if (vidUrl) URL.revokeObjectURL(vidUrl);
  vid.src = vidUrl = URL.createObjectURL(b);
  vid.addEventListener('loadedmetadata', () => { vid.currentTime = start; vid.playbackRate = +$('rate').value; }, { once: true });
}
$('vidFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  if (!R) return alert('Create an opponent first.');
  let f = film?.local && film.missing ? film : null; // ponytail: re-upload reattaches to the missing film so plays keep their times
  if (!f) {
    const label = prompt('Name this game (ex: vs Knights, Oct 12)', file.name.replace(/\.[^.]+$/, '')) || `Game ${R.films.length + 1}`;
    f = { id: uid(), label, local: true, name: file.name }; R.films.push(f);
  }
  vidMem[f.id] = file; delete f.missing;
  touch(); renderFilms(); loadFilm(f.id);
  status('Saving video on this device...');
  try { await put('vid:' + f.id, file); status('Video saved on this device'); }
  catch { status('Video plays now but is too big to keep on this device. You will need to upload it again next time.', true); }
};
function cue() {
  const start = pendingSeek ?? 0; pendingSeek = null;
  if (yt?.cueVideoById) { yt.cueVideoById({ videoId: film.yt, startSeconds: start }); return; }
  yt = new YT.Player('yt', { videoId: film.yt, playerVars: { rel: 0, playsinline: 1, modestbranding: 1, origin: location.origin, start },
    events: { onError: e => { if ([100, 101, 150, 153].includes(e.data)) banner('The owner of this video blocks playing it on other pages. Watch it with Open on YouTube, type the time into each play, and use screenshots as normal.'); } } });
}
const now = () => { if (film?.local) return vid.currentTime || 0; try { return yt?.getCurrentTime?.() || 0; } catch { return 0; } };
function seek(t) { if (film?.local) vid.currentTime = Math.max(0, t); else if (yt?.seekTo) yt.seekTo(Math.max(0, t), true); }
function togglePlay() { if (film?.local) vid.paused ? vid.play() : vid.pause(); else if (yt?.getPlayerState) yt.getPlayerState() === 1 ? yt.pauseVideo() : yt.playVideo(); }
setInterval(() => { $('time').textContent = fmtT(now()); }, 250);

/* ---------- plays ---------- */
const P = () => R?.plays.find(p => p.id === sel);
function markPlay() {
  if (!R) return alert('Create an opponent first.');
  const prev = R.plays.at(-1);
  vid.pause(); try { yt?.pauseVideo?.(); } catch {}
  const p = { id: uid(), film: film?.id || '', t: Math.floor(now()), side: prev?.side || 'O', marks: [], lines: [] };
  R.plays.push(p); R.plays.sort((a, b) => (a.film === b.film ? a.t - b.t : 0));
  sel = p.id; touch(); renderAll();
}
const num = p => R.plays.indexOf(p) + 1;
const call = p => p.side === 'O' ? [p.ptype, p.concept, p.dir].filter(Boolean).join(' ') : [p.front, p.coverage, p.blitz && p.blitz !== 'None' ? 'blitz' : ''].filter(Boolean).join(' / ');
function renderStrip() {
  $('plays').innerHTML = R?.plays.map(p => `<tr data-id="${esc(p.id)}" class="${p.id === sel ? 'sel' : ''}"><td>${num(p)}</td><td>${fmtT(p.t)}</td><td>${p.side === 'O' ? 'Off' : 'Def'}</td><td>${p.down ? esc(p.down) + '&amp;' + esc(p.dist ?? '') : ''}</td><td>${esc(p.formation)}</td><td>${esc(call(p))}</td><td>${esc(p.result)}</td><td>${p.inBook ? '★' : ''}</td></tr>`).join('') || '';
  $('plays').querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}
const opt = (...a) => a.map(v => `<option>${esc(v)}</option>`).join('');
const FIELDS = {
  common: [['t','Film time','time'],['down','Down','sel',['1','2','3','4']],['dist','Distance','num'],['qtr','Qtr','sel',['1','2','3','4','OT']],['yard','Yard line','text'],['hash','Hash','sel',['Left','Middle','Right']],['formation','Formation','list'],['strength','Strength','sel',['Left','Right','Balanced']]],
  O: [['ptype','Play type','sel',['Run','Pass','RPO','Screen','Trick','Special']],['concept','Play / concept','list'],['dir','Direction','sel',['Left','Middle','Right']],['key','Key player #','text']],
  D: [['front','Front','list'],['coverage','Coverage','list'],['blitz','Blitz / stunt','sel',['None','DL stunt','LB','DB','Overload']],['blitzSide','Pressure from','sel',['Left','Middle','Right']]],
  end: [['result','Yards gained','num']],
};
const DEFAULTS = { formation: ['I','Pro','Wing T','Double Wing','Shotgun Spread','Trips','Empty','Single Back'], concept: ['Dive','Power','Counter','Trap','Sweep','Toss','Iso','Zone','Jet','QB Keep','Slant','Go','Bubble','Play Action'], front: ['4-4','5-3','6-2','4-3','3-4','3-5','Bear'], coverage: ['Cover 0','Cover 1','Cover 2','Cover 3','Man','Quarters'] };
function renderForm() {
  const p = P(); $('editor').style.visibility = p ? '' : 'hidden'; if (!p) return;
  const field = ([k, label, type, opts]) => {
    const v = k === 't' ? fmtT(p.t) : p[k] ?? '';
    let c;
    if (type === 'sel') c = `<select id="f-${k}" data-k="${k}"><option value=""></option>${opts.map(o => `<option${o === String(v) ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
    else c = `<input id="f-${k}" data-k="${k}" value="${esc(v)}" ${type === 'num' ? 'type="number" ' : ''}${type === 'list' ? `list="dl-${k}" autocomplete="off"` : ''}>`;
    return `<label>${label}${c}</label>`;
  };
  $('form').innerHTML = `<label>Side<span class="seg"><button type="button" data-side="O" class="${p.side === 'O' ? 'on' : ''}">Their O</button><button type="button" data-side="D" class="${p.side === 'D' ? 'on' : ''}">Their D</button></span></label>`
    + [...FIELDS.common, ...FIELDS[p.side], ...FIELDS.end].map(field).join('')
    + `<div class="wide"><label style="flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--fg)"><input type="checkbox" id="f-inBook" data-k="inBook" style="width:auto" ${p.inBook ? 'checked' : ''}> Add to playbook</label></div>`
    + `<label class="wide">Playbook name<input id="f-name" data-k="name" value="${esc(p.name)}"></label><label class="wide">Notes<textarea id="f-notes" data-k="notes">${esc(p.notes)}</textarea></label>`;
  for (const k in DEFAULTS) $('dl-' + k).innerHTML = opt(...new Set([...R.plays.map(x => x[k]).filter(Boolean), ...DEFAULTS[k]]));
}
$('form').addEventListener('input', e => {
  const k = e.target.dataset.k, p = P(); if (!k || !p) return;
  p[k] = k === 'inBook' ? e.target.checked : k === 't' ? parseT(e.target.value) : e.target.value;
  touch(); renderStrip();
});
$('form').addEventListener('click', e => { const s = e.target.dataset.side; if (s && P()) { e.preventDefault(); P().side = s; touch(); renderForm(); renderStrip(); } });

/* ---------- diagram ---------- */
const YD = 18.75, LOS = 375, TOOLS = [['move','Move'],['O','O'],['X','X'],['route','Route'],['block','Block'],['motion','Motion'],['erase','Erase']];
let tool = 'move', undoStack = [], drag = null;
$('tools').innerHTML = TOOLS.map(([k, n]) => `<button data-tool="${k}" class="${k === tool ? 'on' : ''}">${n}</button>`).join('');
$('tools').onclick = e => { const t = e.target.dataset.tool; if (t) { tool = t; [...$('tools').children].forEach(b => b.classList.toggle('on', b.dataset.tool === t)); } };
const LINE = { route: '#f2c230', block: '#ffffff', motion: '#7fd6ff' };
function fieldLines() {
  let s = '';
  for (let i = -3; i <= 4; i++) { const y = LOS + i * 5 * YD; if (y > 0 && y < 600) s += `<line x1="0" x2="1000" y1="${y}" y2="${y}" stroke="#fff" stroke-opacity=".22"/>`; }
  for (let y = LOS % YD; y < 600; y += YD) for (const x of [0, 333, 667, 992]) s += `<line x1="${x}" x2="${x + 8}" y1="${y}" y2="${y}" stroke="#fff" stroke-opacity=".3"/>`;
  return s + `<line x1="0" x2="1000" y1="${LOS}" y2="${LOS}" stroke="#f2c230" stroke-width="2" stroke-opacity=".7"/>`;
}
function lineSvg(l) {
  const pts = l.pts, c = LINE[l.k]; if (pts.length < 2) return '';
  const a = pts.at(-2), b = pts.at(-1), ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  let end;
  if (l.k === 'block') { const dx = 13 * Math.cos(ang + Math.PI / 2), dy = 13 * Math.sin(ang + Math.PI / 2); end = `<line x1="${b[0] - dx}" y1="${b[1] - dy}" x2="${b[0] + dx}" y2="${b[1] + dy}" stroke="${c}" stroke-width="4"/>`; }
  else { const h = t => `${b[0] - 18 * Math.cos(ang + t)},${b[1] - 18 * Math.sin(ang + t)}`; end = `<polygon points="${b[0]},${b[1]} ${h(.45)} ${h(-.45)}" fill="${c}"/>`; }
  return `<polyline points="${pts.map(q => q.join()).join(' ')}" fill="none" stroke="${c}" stroke-width="3.5" stroke-linejoin="round" ${l.k === 'motion' ? 'stroke-dasharray="10 8"' : ''}/>${end}`;
}
function markSvg(m) {
  const l = esc(m.l || '');
  return m.t === 'O'
    ? `<circle cx="${m.x}" cy="${m.y}" r="20" fill="#fff"/><text x="${m.x}" y="${m.y + 6}" text-anchor="middle" font-size="17" font-weight="700" fill="#102">${l}</text>`
    : `<g stroke="#f2c230" stroke-width="5" stroke-linecap="round"><line x1="${m.x - 15}" y1="${m.y - 15}" x2="${m.x + 15}" y2="${m.y + 15}"/><line x1="${m.x + 15}" y1="${m.y - 15}" x2="${m.x - 15}" y2="${m.y + 15}"/></g><text x="${m.x}" y="${m.y - 21}" text-anchor="middle" font-size="17" font-weight="700" fill="#f2c230">${l}</text>`;
}
const diagram = (p, shot) => (shot && shotUrls[p.shot] ? `<image href="${esc(shotUrls[p.shot])}" width="1000" height="600" preserveAspectRatio="xMidYMid meet" opacity=".8"/>` : fieldLines())
  + (p.lines || []).map(lineSvg).join('') + (p.marks || []).map(markSvg).join('');
function renderField() { const p = P(); if (p) $('field').innerHTML = diagram(p, $('showShot').checked); }
function pt(e) { const q = new DOMPoint(e.clientX, e.clientY).matrixTransform($('field').getScreenCTM().inverse()); return [Math.round(q.x), Math.round(q.y)]; }
const nearMark = (p, [x, y], r = 30) => p.marks.findLast(m => Math.hypot(m.x - x, m.y - y) < r);
function snap() { const p = P(); undoStack.push(JSON.stringify({ id: p.id, marks: p.marks, lines: p.lines })); if (undoStack.length > 60) undoStack.shift(); }
$('field').addEventListener('pointerdown', e => {
  const p = P(); if (!p) return; const q = pt(e); $('field').setPointerCapture(e.pointerId);
  if (tool === 'move') { const m = nearMark(p, q); if (m) { snap(); drag = { m }; $('label').value = m.l || ''; drag.sel = m; moveSel = m; } }
  else if (tool === 'O' || tool === 'X') { snap(); const m = { t: tool, x: q[0], y: q[1], l: $('label').value.trim() }; p.marks.push(m); $('label').value = ''; moveSel = m; touch(); }
  else if (tool === 'erase') {
    const m = nearMark(p, q); snap();
    if (m) p.marks.splice(p.marks.indexOf(m), 1);
    else { const i = p.lines.findLastIndex(l => l.pts.some(a => Math.hypot(a[0] - q[0], a[1] - q[1]) < 18)); if (i >= 0) p.lines.splice(i, 1); else undoStack.pop(); }
    touch();
  } else { snap(); drag = { l: { k: tool, pts: [q] } }; p.lines.push(drag.l); }
  renderField();
});
let moveSel = null;
$('field').addEventListener('pointermove', e => {
  if (!drag) return; const q = pt(e);
  if (drag.m) { drag.m.x = q[0]; drag.m.y = q[1]; }
  else { const a = drag.l.pts.at(-1); if (Math.hypot(a[0] - q[0], a[1] - q[1]) > 12) drag.l.pts.push(q); }
  renderField();
});
$('field').addEventListener('pointerup', () => {
  if (!drag) return; const p = P();
  if (drag.l && drag.l.pts.length < 2) { p.lines.pop(); undoStack.pop(); }
  drag = null; touch(); renderField();
});
$('label').addEventListener('input', () => { if (moveSel && P()?.marks.includes(moveSel)) { moveSel.l = $('label').value; touch(); renderField(); } });
function undo() { const s = undoStack.pop(); if (!s) return; const u = JSON.parse(s), p = R.plays.find(x => x.id === u.id); if (p) { sel = p.id; p.marks = u.marks; p.lines = u.lines; touch(); renderAll(); } }

const OL = [[400,'T'],[450,'G'],[500,'C'],[550,'G'],[600,'T']].map(([x, l]) => [x, 400, l]);
const DY = 350, LB = 275;
const PRESETS = {
  O: { 'I formation': [...OL,[650,400,'Y'],[120,400,'X'],[880,415,'Z'],[500,440,'Q'],[500,490,'F'],[500,540,'H']],
    'Wing T': [...OL,[650,400,'Y'],[695,425,'W'],[120,400,'X'],[500,435,'Q'],[500,490,'F'],[415,510,'H']],
    'Shotgun': [...OL,[650,400,'Y'],[120,400,'X'],[880,400,'Z'],[770,415,'A'],[500,490,'Q'],[555,490,'H']],
    'Spread': [...OL,[100,400,'X'],[210,415,'B'],[900,400,'Z'],[790,415,'A'],[500,490,'Q'],[555,490,'H']] },
  D: { '5-3': [[380,DY,'E'],[440,DY,'T'],[500,DY,'N'],[560,DY,'T'],[620,DY,'E'],[420,LB,'S'],[500,LB,'M'],[580,LB,'W'],[130,DY-40,'C'],[870,DY-40,'C'],[500,160,'F']],
    '4-4': [[390,DY,'E'],[450,DY,'T'],[550,DY,'T'],[610,DY,'E'],[330,LB,'S'],[450,LB,'M'],[550,LB,'M'],[670,LB,'W'],[130,DY-40,'C'],[870,DY-40,'C'],[500,160,'F']],
    '6-2': [[350,DY,'E'],[420,DY,'T'],[480,DY,'G'],[520,DY,'G'],[580,DY,'T'],[650,DY,'E'],[440,LB,'M'],[560,LB,'W'],[130,DY-40,'C'],[870,DY-40,'C'],[500,160,'F']],
    '4-3': [[390,DY,'E'],[450,DY,'T'],[550,DY,'T'],[610,DY,'E'],[400,LB,'S'],[500,LB,'M'],[600,LB,'W'],[130,DY-40,'C'],[870,DY-40,'C'],[380,170,'S'],[620,170,'F']],
    '3-4': [[420,DY,'E'],[500,DY,'N'],[580,DY,'E'],[340,LB,'S'],[450,LB,'M'],[550,LB,'M'],[660,LB,'W'],[130,DY-40,'C'],[870,DY-40,'C'],[380,170,'S'],[620,170,'F']] },
};
for (const s of ['O', 'D']) $('preset' + s).innerHTML += opt(...Object.keys(PRESETS[s]));
for (const s of ['O', 'D']) $('preset' + s).onchange = e => {
  const p = P(), name = e.target.value; e.target.value = ''; if (!p || !name) return;
  snap(); const t = s === 'O' ? 'O' : 'X';
  p.marks = p.marks.filter(m => m.t !== t).concat(PRESETS[s][name].map(([x, y, l]) => ({ t, x, y, l })));
  touch(); renderField();
};
$('flip').onclick = () => { const p = P(); if (!p) return; snap(); p.marks.forEach(m => m.x = 1000 - m.x); p.lines.forEach(l => l.pts.forEach(a => a[0] = 1000 - a[0])); touch(); renderField(); };
$('undo').onclick = undo;
$('clearD').onclick = () => { const p = P(); if (!p) return; snap(); p.marks = []; p.lines = []; touch(); renderField(); };
$('copyPrev').onclick = () => { const p = P(), i = R?.plays.indexOf(p); if (!i) return; const q = R.plays[i - 1]; snap(); p.marks = structuredClone(q.marks); p.lines = structuredClone(q.lines); p.formation ||= q.formation; p.front ||= q.front; touch(); renderForm(); renderField(); };
$('showShot').onchange = renderField;

/* ---------- screenshots: paste, or pick from Photos on iPad ---------- */
async function addShot(file) {
  const p = P(); if (!p) return alert('Mark a play first, then add the screenshot.');
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1400 / bmp.width), c = document.createElement('canvas');
    c.width = bmp.width * k; c.height = bmp.height * k; c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85)), key = `${R.id}-${p.id}`;
    await put('img:' + key, blob);
    if (shotUrls[key]) URL.revokeObjectURL(shotUrls[key]);
    shotUrls[key] = URL.createObjectURL(blob); p.shot = key; $('showShot').checked = true; touch(); renderField();
  } catch { status('Screenshot not saved. Try that image again.', true); }
}
document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); addShot(item.getAsFile()); }
});
$('shotFile').onchange = e => { if (e.target.files[0]) addShot(e.target.files[0]); e.target.value = ''; };

/* ---------- export / import: the backup and what Claude builds the PDF from ---------- */
const toData = b => new Promise((ok, no) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = no; f.readAsDataURL(b); });
async function exportReport() {
  if (!R) return alert('Create an opponent first.');
  await flush();
  const images = {};
  for (const p of R.plays) if (p.shot) { const b = await get('img:' + p.shot); if (b) images[p.shot] = await toData(b); }
  const name = `film-room-${R.opponent.replace(/[^\w-]+/g, '-')}-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify({ report: R, images })], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); status('Exported'); } catch (e) { if (e.name !== 'AbortError') status('Export failed. Try again.', true); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); status('Exported');
}
$('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const { report, images } = JSON.parse(await f.text());
    if (!report?.id || !Array.isArray(report.plays)) throw 0;
    if (index.some(r => r.id === report.id) && !confirm(`Replace ${report.opponent} on this device with this file?`)) return;
    for (const k in images || {}) if (String(images[k]).startsWith('data:image/')) await put('img:' + k, await (await fetch(images[k])).blob());
    await put('report:' + report.id, report);
    index = index.filter(r => r.id !== report.id).concat({ id: report.id, opponent: report.opponent });
    await put('index', index); renderReports(); await loadReport(report.id); $('report').value = report.id; status('Imported');
  } catch { status('That file is not a Film Room export.', true); }
};

/* ---------- tendencies + playbook ---------- */
function tbl(title, rows, cols) {
  if (!rows.length) return '';
  return `<h2>${title}</h2><div class="tscroll"><table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${esc(r[c[1]] ?? '')}${r[c[1]] != null && c[2] ? c[2] : ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderTend() {
  const t = tendencies(R?.plays || []);
  const oc = n => [[n,'key'],['Plays','n'],['Run','runPct','%'],['Pass','passPct','%'],['Top play','top'],['Direction','dir'],['Avg yds','yds']];
  const dc = n => [[n,'key'],['Snaps','n'],['Top front','front'],['Top coverage','coverage'],['Pressure','blitzPct','%'],['Avg yds allowed','yds']];
  $('tend').innerHTML = (!R || !R.plays.length) ? '<div class="empty">Mark plays and tag them. Tendencies build here as you go.</div>'
    : `<h2 style="margin-top:0">Their offense: ${t.offense.total} plays</h2>` + tbl('Overall', [t.offense.overall], oc(''))
    + tbl('By formation', t.offense.byFormation, oc('Formation')) + tbl('By down and distance', t.offense.bySituation, oc('Situation'))
    + tbl('By hash', t.offense.byHash, oc('Hash')) + tbl('By play', t.offense.byConcept, oc('Play'))
    + `<h2>Their defense: ${t.defense.total} snaps</h2>` + tbl('Overall', [t.defense.overall], dc(''))
    + tbl('By front', t.defense.byFront, dc('Front')) + tbl('By down and distance', t.defense.bySituation, dc('Situation'))
    + `<p class="hint">Small samples can mislead. Counts are shown so you can judge.</p>`;
}
function renderBook() {
  const ps = (R?.plays || []).filter(p => p.inBook);
  $('book').innerHTML = ps.length ? `<div class="cards">${ps.map(p => `<div class="card" data-id="${esc(p.id)}"><b>${esc(p.name || p.concept || p.front || 'Play ' + num(p))}</b>
    <svg viewBox="0 0 1000 600">${diagram(p, false)}</svg><p>${p.side === 'O' ? 'Offense' : 'Defense'}${p.formation ? ' · ' + esc(p.formation) : ''}${call(p) ? ' · ' + esc(call(p)) : ''}</p><p>${esc(p.notes)}</p></div>`).join('')}</div>`
    : '<div class="empty">Check "Add to playbook" on a play and it shows up here.</div>';
}
function setTab(t) {
  for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.t === t);
  $('chart').hidden = t !== 'chart'; $('chart').style.display = t === 'chart' ? '' : 'none'; $('tend').hidden = t !== 'tend'; $('book').hidden = t !== 'book';
  if (t === 'tend') renderTend(); if (t === 'book') renderBook();
}
function renderAll() { renderStrip(); renderForm(); renderField(); }
function selectPlay(id, jump) { sel = id; moveSel = null; const p = P(); renderAll(); if (jump && p) { if (p.film && p.film !== film?.id) { pendingSeek = p.t; loadFilm(p.film); } else seek(p.t); } }

/* ---------- wiring ---------- */
$('newReport').onclick = newReport;
$('export').onclick = exportReport;
$('report').onchange = async e => { await flush(); if (e.target.value) loadReport(e.target.value); };
$('addFilm').onclick = addFilm;
$('film').onchange = e => loadFilm(e.target.value);
$('pp').onclick = togglePlay;
$('rate').onchange = e => { vid.playbackRate = +e.target.value; yt?.setPlaybackRate?.(+e.target.value); };
$('mark').onclick = markPlay;
document.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => seek(now() + +b.dataset.seek));
$('plays').onclick = e => { const tr = e.target.closest('tr'); if (tr) selectPlay(tr.dataset.id, true); };
$('tabs').onclick = e => { if (e.target.dataset.t) setTab(e.target.dataset.t); };
$('book').onclick = e => { const c = e.target.closest('.card'); if (c) { setTab('chart'); selectPlay(c.dataset.id, true); } };
$('delPlay').onclick = () => { const p = P(); if (p && confirm(`Delete play ${num(p)}?`)) { R.plays.splice(R.plays.indexOf(p), 1); sel = R.plays.at(-1)?.id || null; touch(); renderAll(); } };
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !/INPUT|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); return undo(); }
  if (/INPUT|TEXTAREA|SELECT|VIDEO/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'm' || e.key === 'M') markPlay();
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') seek(now() - (e.shiftKey ? 5 : 1));
  else if (e.key === 'ArrowRight') seek(now() + (e.shiftKey ? 5 : 1));
});
(async () => {
  try { index = await get('index') || []; }
  catch { return banner('This browser is blocking saved data. Turn off Private Browsing and reload.'); }
  renderReports(); renderForm();
  if (index.length) loadReport(index.at(-1).id);
  else banner('Your plays save on this device only. Tap Export after each session to back them up. Start with New opponent, then paste a YouTube link or upload a video. Uploaded videos stay on this device and are not in the Export file.');
})();
</script></body></html>
